name: "Test with Pytest the Python package using Poetry"

on:
  # TODO: Uncomment this when ready
  # push:
  #   branches:
  #   - "main"
  #   paths:
  #   - "src/lihzahrd/**"
  #   - "pyproject.toml"
  #   - "poetry.lock"
  #   - ".forgejo/workflows/python-uv-pytest-new_python_commit.yml"
  # pull_request:
  #   types:
  #   - opened
  #   - synchronize

jobs:
  test:
    name: "Run tests"
    runs-on: default
    
    steps:
      -
        name: "Checkout repository"
        uses: https://code.forgejo.org/actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      -
        name: "Run Pytest with coverage"
        run: |-
          uv run --all-extras --group='test' pytest --cov='${{ vars.PYTHON_PACKAGE }}' --color="yes"
        env:
          CI: "1"
      -
        name: "Upload coverage artifact"
        uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245
        with:
          name: "Coverage"
          path: .coverage
          if-no-files-found: warn
