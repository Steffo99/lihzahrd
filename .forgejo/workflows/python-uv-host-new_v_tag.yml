%YAML 1.1
---
name: "Release using uv a new version of the Python package and deploy docs on a host directory"

on: 
  push:
    tags:
      - 'v*'

jobs:
  package:
    name: "Build package"
    runs-on: default

    steps:
      -
        name: "Checkout repository"
        uses: https://code.forgejo.org/actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      -
        name: "Build package"
        run: |-
          uv build --verbose
      -
        name: "Upload package as artifact"
        uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245
        with:
          name: &package_artifact_name "Package.zip"
          path: dist/
          if-no-files-found: error

  docs:
    name: "Build documentation"
    runs-on: default

    steps:
      -
        name: "Checkout repository"
        uses: https://code.forgejo.org/actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      -
        name: "Build docs"
        run: |-
          uv run --group='docs' sphinx-build 'docs/' 'dist/'
      -
        name: "Upload docs as artifact"
        uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245
        with:
          name: &documentation_artifact_name "Documentation.zip"
          path: dist/
          if-no-files-found: error
    
  publish_forgejo:
    name: "Publish package on Forgejo Packages"
    runs-on: default

    needs:
      - package

    steps:
      -
        name: "Download package artifact"
        uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f
        with:
          name: *package_artifact_name
          path: dist/
      -
        name: "Upload package"
        run: twine upload dist/** --verbose --disable-progress-bar
        env:
          TWINE_NON_INTERACTIVE: "1"
          TWINE_REPOSITORY_URL: "${{ github.server_url }}/api/packages/${{ github.repository_owner }}/pypi"
          TWINE_USERNAME: "${{ github.repository_owner }}"
          TWINE_PASSWORD: "${{ secrets.FORGE_PACKAGES_TOKEN }}"
    
  publish_testpypi:
    name: "Publish package on Test PyPI"
    runs-on: default

    needs:
      - package

    steps:
      -
        name: "Download package artifact"
        uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f
        with:
          name: *package_artifact_name
          path: dist/
      -
        name: "Upload package"
        run: twine upload dist/** --verbose --disable-progress-bar
        env:
          TWINE_NON_INTERACTIVE: "1"
          TWINE_REPOSITORY_URL: "https://test.pypi.org/legacy/"
          TWINE_USERNAME: "__token__"
          TWINE_PASSWORD: "${{ secrets.TEST_PYPI_TOKEN }}"
    
  publish_pypi:
    name: "Publish package on PyPI"
    runs-on: default

    needs:
      - package

    steps:
      -
        name: "Download package artifact"
        uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f
        with:
          name: *package_artifact_name
          path: dist/
      -
        name: "Upload package"
        run: twine upload dist/** --verbose --disable-progress-bar
        env:
          TWINE_NON_INTERACTIVE: "1"
          TWINE_REPOSITORY_URL: "https://upload.pypi.org/legacy/"
          TWINE_USERNAME: "__token__"
          TWINE_PASSWORD: "${{ secrets.PYPI_TOKEN }}"

  explain:
    name: "Publish documentation via host runner"
    runs-on: host-temeria

    needs:
      - docs

    steps:
      -
        name: "Download docs artifact"
        uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f
        with:
          name: *documentation_artifact_name
          path: deploy/docs/
      -
        name: "Deploy documentation"
        uses: https://g.starshard.space/steffo/actions-deploy-link@4787279abac0d8dd48beec5d0831cbe9e710c589
        with:
          source: "deploy"
          destination: "/mnt/beta/artifacts/${{ github.repository }}"
          dir-name: "${{ github.ref_name }}"
          link-name: "latest"
